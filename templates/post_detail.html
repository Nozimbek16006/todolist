<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h1>{{ post.title }}</h1>
<p>{{ post.content }}</p>
<p>{{ post.created_at }}</p>
{% if post.is_completed %}
    <p>Task Bajarilgan</p>
{% endif %}
<a href="{% url 'post_edit' post.pk %}">Edit Todo</a> <br>
<a href="{% url 'post_delete' post.pk %}">Delete Todo</a>
</body>
</html>
